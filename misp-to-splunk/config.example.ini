# คัดลอกเป็น config.ini แล้วแก้ค่า  (ห้าม commit config.ini ที่มี key จริง)
# ค่า secret ใส่ผ่าน environment variable ได้: MISP_API_KEY, SPLUNK_TOKEN

[misp]
url = https://misp.tb-cert.example          ; URL MISP ที่ TB-CERT ให้สมาชิก
api_key =                                    ; Auth key ของ user org ธนาคาร (สิทธิ์ read-only/User)
verify_tls = true                            ; หรือ path ไปยัง CA bundle ขององค์กร
proxy =                                      ; เช่น http://proxy.bank.local:8080
# ดึงเฉพาะ type ที่เครื่องมือ block รองรับ
types = ip-dst,ip-src,ip-dst|port,ip-src|port,domain,hostname,domain|ip,url,md5,sha1,sha256,filename|md5,filename|sha1,filename|sha256,email-src
# ดึงแบบ incremental ย้อนหลังเท่าไร (ใช้ตอนรันตามรอบ เช่นทุก 15 นาที → 1h เพื่อให้มี overlap)
lookback = 1h
# ดึงครั้งแรกแบบ full ย้อนหลังเท่าไร
initial_lookback = 90d
page_size = 1000

[filter]
# ดึงเฉพาะ event ที่ publish แล้ว และ attribute ที่ติดธง to_ids (ผู้แชร์ยืนยันว่าใช้ detect/block ได้)
published_only = true
to_ids_only = true
# ให้ MISP ตัด IOC ที่ตรงกับ warninglist (เช่น Google DNS, Microsoft, CDN, Alexa top) ทิ้ง → ลด false positive
enforce_warninglist = true
# TLP ที่อนุญาตให้นำไปใช้ block ภายในธนาคาร (ไม่ส่งต่อออกนอกองค์กร)
allowed_tlp = tlp:clear,tlp:white,tlp:green,tlp:amber,tlp:amber+strict
# ถ้า event/attribute มี tag เหล่านี้ จะไม่นำไป block
exclude_tags = tlp:red,false-positive,workflow:state="incomplete"
# ไฟล์ allowlist ของธนาคารเอง (IP/โดเมนภายใน, partner, ITMX/NITMX, cloud ที่ใช้งาน ฯลฯ)
allowlist_file = allowlist.txt

[ttl]
# อายุ IOC (วัน) นับจาก last_seen/timestamp ล่าสุด หมดอายุแล้วจะถูกลบจาก blocklist อัตโนมัติ
ip = 30
domain = 90
url = 90
hash = 365
email = 90

[splunk]
# Splunk management port (REST) ของ search head
url = https://splunk-sh.bank.local:8089
token =                                      ; Splunk authentication token (role ที่เขียน KV store ของ app ได้)
app = TA-tbcert-misp
collection = tbcert_misp_ioc
verify_tls = true
# ส่ง event log การ sync เข้า index ผ่าน HEC (ไม่บังคับ) เพื่อทำ audit trail
hec_url =
hec_token =
hec_index = threat_intel

# ===========================================================================
#  push_blocklists.py — ส่ง IOC (action=block) ไปเครื่องมือ block
#  secret ใส่ผ่าน env: S1_API_TOKEN, IMPERVA_API_ID, IMPERVA_API_KEY, PTR_API_KEY
# ===========================================================================
[push]
state_file = push_state.json          ; จำว่าสคริปต์เพิ่มอะไรไว้ (ห้ามลบ ไม่งั้นจะลบของเก่าไม่ได้)
max_add_per_run = 2000                ; เกินนี้จะไม่ส่ง (กันข้อมูลผิดปกติ)
max_remove_per_run = 500
verify_tls = true

[sentinelone]
enabled = false
url = https://<tenant>.sentinelone.net
api_token =
hash_types = sha1,sha256              ; ตรวจว่าคอนโซลรองรับ SHA256 ใน Blocklist หรือไม่ (md5 ไม่รองรับ)
os_types = windows,macos,linux
scope = tenant                        ; tenant | account:<id> | site:<id>
description_prefix = TB-CERT MISP
max_entries = 20000

[imperva]
enabled = false
api_url = https://my.imperva.com
api_id =
api_key =
site_ids = 1234567                    ; คั่นด้วย , ได้หลาย site
max_entries = 1000                    ; ตรวจขีดจำกัด ACL ของ account ก่อนเพิ่ม

[proofpoint]
enabled = false
mode = csv                            ; csv = ไฟล์สำหรับ import | ptr = Proofpoint Threat Response list API
types = email,domain
csv_dir = proofpoint_out
ptr_url = https://ptr.bank.local
ptr_api_key =
ptr_list_email =                      ; id ของ list ใน PTR ที่ผูกกับ sender blocklist ของ PPS/PoD
ptr_list_domain =
max_entries = 50000

# ===========================================================================
#  reconcile_misp_splunk.py — ตรวจความครบถ้วน MISP เทียบ sourcetype=misp_events
# ===========================================================================
[reconcile]
window = 30d                          ; ช่วงเวลาฝั่ง MISP
time_field = publish_timestamp        ; publish_timestamp (event ที่ publish ในช่วงนี้) หรือ timestamp (attribute ที่แก้ไขในช่วงนี้)
threat_levels = 1,2,3,4               ; ดึงแยกทีละระดับเพื่อรู้ว่าขาดระดับไหน
to_ids = any                          ; any | true | false  (ตั้งให้ตรงกับตัวดึงข้อมูลเดิม ถ้าต้องการเช็กเฉพาะสิ่งที่ควรมี)
published_only = true
enforce_warninglist = false
types =                               ; ว่าง = ทุกชนิด
page_size = 1000
splunk_base = index=main sourcetype=misp_events
splunk_earliest = -35d                ; กว้างกว่า window เล็กน้อย เพราะ _time ใน Splunk = เวลานำเข้า
max_missing_pct = 1.0                 ; ขาดเกินกี่ % ให้ exit code 2 (ใช้ทำ alert)
hec_max_items = 20000                 ; จำนวนรายละเอียดสูงสุดที่ส่งเข้า HEC ต่อรอบ (สำหรับ dashboard)

# ===========================================================================
#  แอป MISP42Splunk ที่ติดตั้งอยู่บน Splunk (preflight ใช้ตรวจ config และทดสอบ | mispgetioc จากฝั่ง Splunk)
# ===========================================================================
[misp42splunk]
instance = MISP_TBCERT                ; ชื่อ instance ใน MISP42Splunk > Configuration > MISP instances
app = misp42splunk
