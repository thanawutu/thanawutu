[tbcert_misp_ioc_lookup]
external_type = kvstore
collection    = tbcert_misp_ioc
case_sensitive_match = false
fields_list   = _key, indicator, indicator_type, misp_type, category, event_id, event_uuid, event_info, attribute_uuid, comment, tags, tlp, threat_level_id, severity, org, source, first_seen, last_seen, updated, expires, status, action

# allowlist ของธนาคาร (แก้ไขผ่าน Lookup Editor หรือไฟล์ใน lookups/)
[tbcert_allowlist_ip]
filename   = tbcert_allowlist_ip.csv
match_type = CIDR(cidr)
max_matches = 1

[tbcert_allowlist_domain]
filename   = tbcert_allowlist_domain.csv
case_sensitive_match = false
max_matches = 1
