# ---------------------------------------------------------------------------
# 1) DETECTION — หา traffic/log ที่ตรงกับ IOC (รู้ว่ามีใครโดนไปแล้วก่อน block)
#    ใช้ CIM data model; ปรับชื่อ field/datamodel ตาม environment ของธนาคาร
# ---------------------------------------------------------------------------
[TBCERT - IOC Match - Network Traffic]
search = | tstats summariesonly=true count min(_time) as firstTime max(_time) as lastTime \
    from datamodel=Network_Traffic.All_Traffic by All_Traffic.src All_Traffic.dest All_Traffic.dest_port All_Traffic.action \
  | rename All_Traffic.* as * \
  | lookup tbcert_misp_ioc_lookup indicator AS dest OUTPUTNEW event_info tlp tags event_id indicator_type expires \
  | where isnotnull(event_info) AND indicator_type="ip" AND expires > now() \
  | convert ctime(firstTime) ctime(lastTime)
dispatch.earliest_time = -20m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 1
alert.suppress.fields = src,dest
alert.suppress.period = 4h

[TBCERT - IOC Match - Web Proxy URL/Domain]
search = | tstats summariesonly=true count min(_time) as firstTime max(_time) as lastTime \
    from datamodel=Web.Web by Web.src Web.url Web.url_domain Web.action \
  | rename Web.* as * \
  | lookup tbcert_misp_ioc_lookup indicator AS url_domain OUTPUTNEW event_info AS d_info tlp AS d_tlp expires AS d_exp \
  | lookup tbcert_misp_ioc_lookup indicator AS url OUTPUTNEW event_info AS u_info tlp AS u_tlp expires AS u_exp \
  | eval event_info=coalesce(u_info, d_info), tlp=coalesce(u_tlp, d_tlp), expires=coalesce(u_exp, d_exp) \
  | where isnotnull(event_info) AND expires > now()
dispatch.earliest_time = -20m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0

[TBCERT - IOC Match - DNS Query]
search = | tstats summariesonly=true count from datamodel=Network_Resolution.DNS by DNS.src DNS.query \
  | rename DNS.* as * \
  | lookup tbcert_misp_ioc_lookup indicator AS query OUTPUTNEW event_info tlp expires \
  | where isnotnull(event_info) AND expires > now()
dispatch.earliest_time = -20m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0

[TBCERT - IOC Match - Endpoint File Hash]
search = | tstats summariesonly=true count from datamodel=Endpoint.Processes by Processes.dest Processes.process_name Processes.process_hash \
  | rename Processes.* as * \
  | rex field=process_hash "(?i)SHA256=(?<sha256>[a-f0-9]{64})" \
  | rex field=process_hash "(?i)MD5=(?<md5>[a-f0-9]{32})" \
  | eval hash=coalesce(sha256, md5, process_hash) \
  | lookup tbcert_misp_ioc_lookup indicator AS hash OUTPUTNEW event_info tlp expires \
  | where isnotnull(event_info) AND expires > now()
dispatch.earliest_time = -20m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0

# ---------------------------------------------------------------------------
# 2) BLOCKLIST EXPORT — สร้าง CSV lookup แยกตามชนิด สำหรับส่งต่อเครื่องมือ block
#    (export_edl.py จะดึงไปเขียนเป็นไฟล์ EDL/text feed อีกที)
# ---------------------------------------------------------------------------
[TBCERT - Build Blocklist]
search = | inputlookup tbcert_misp_ioc_lookup \
  | where expires > now() \
  | stats max(last_seen) as last_seen values(event_info) as event_info by indicator indicator_type \
  | outputlookup tbcert_blocklist.csv
cron_schedule = 5,20,35,50 * * * *
enableSched = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now

# ---------------------------------------------------------------------------
# 3) HEALTH — แจ้งเตือนถ้า sync ไม่ทำงาน (ต้องเปิด HEC audit ใน config)
# ---------------------------------------------------------------------------
[TBCERT - MISP Sync Health]
search = | tstats count where index=threat_intel sourcetype="tbcert:misp:sync" earliest=-2h \
  | where count=0
cron_schedule = 0 * * * *
enableSched = 1
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
