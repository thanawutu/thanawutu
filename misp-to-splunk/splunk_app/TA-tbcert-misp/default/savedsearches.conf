# ---------------------------------------------------------------------------
# 1) DETECTION — หา traffic/log ที่ตรงกับ IOC (รู้ว่ามีใครโดนไปแล้วก่อน block)
#    ใช้ CIM data model; ปรับชื่อ field/datamodel ตาม environment ของธนาคาร
# ---------------------------------------------------------------------------
[TBCERT - IOC Match - Network Traffic]
search = | tstats summariesonly=true count min(_time) as firstTime max(_time) as lastTime \
    from datamodel=Network_Traffic.All_Traffic by All_Traffic.src All_Traffic.dest All_Traffic.dest_port All_Traffic.action \
  | rename All_Traffic.* as * \
  | lookup tbcert_misp_ioc_lookup indicator AS dest OUTPUTNEW event_info tlp tags event_id indicator_type expires \
  | where isnotnull(event_info) AND indicator_type="ip" AND expires > now() \
  | convert ctime(firstTime) ctime(lastTime)
dispatch.earliest_time = -20m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 1
alert.suppress.fields = src,dest
alert.suppress.period = 4h

[TBCERT - IOC Match - Web Proxy URL/Domain]
search = | tstats summariesonly=true count min(_time) as firstTime max(_time) as lastTime \
    from datamodel=Web.Web by Web.src Web.url Web.url_domain Web.action \
  | rename Web.* as * \
  | lookup tbcert_misp_ioc_lookup indicator AS url_domain OUTPUTNEW event_info AS d_info tlp AS d_tlp expires AS d_exp \
  | lookup tbcert_misp_ioc_lookup indicator AS url OUTPUTNEW event_info AS u_info tlp AS u_tlp expires AS u_exp \
  | eval event_info=coalesce(u_info, d_info), tlp=coalesce(u_tlp, d_tlp), expires=coalesce(u_exp, d_exp) \
  | where isnotnull(event_info) AND expires > now()
dispatch.earliest_time = -20m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0

[TBCERT - IOC Match - DNS Query]
search = | tstats summariesonly=true count from datamodel=Network_Resolution.DNS by DNS.src DNS.query \
  | rename DNS.* as * \
  | lookup tbcert_misp_ioc_lookup indicator AS query OUTPUTNEW event_info tlp expires \
  | where isnotnull(event_info) AND expires > now()
dispatch.earliest_time = -20m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0

[TBCERT - IOC Match - Endpoint File Hash]
search = | tstats summariesonly=true count from datamodel=Endpoint.Processes by Processes.dest Processes.process_name Processes.process_hash \
  | rename Processes.* as * \
  | rex field=process_hash "(?i)SHA256=(?<sha256>[a-f0-9]{64})" \
  | rex field=process_hash "(?i)MD5=(?<md5>[a-f0-9]{32})" \
  | eval hash=coalesce(sha256, md5, process_hash) \
  | lookup tbcert_misp_ioc_lookup indicator AS hash OUTPUTNEW event_info tlp expires \
  | where isnotnull(event_info) AND expires > now()
dispatch.earliest_time = -20m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0

# ---------------------------------------------------------------------------
# 2) BLOCKLIST EXPORT — สร้าง CSV lookup แยกตามชนิด สำหรับส่งต่อเครื่องมือ block
#    (export_edl.py จะดึงไปเขียนเป็นไฟล์ EDL/text feed อีกที)
# ---------------------------------------------------------------------------
[TBCERT - Build Blocklist]
search = | inputlookup tbcert_misp_ioc_lookup \
  | where expires > now() \
  | stats max(last_seen) as last_seen values(event_info) as event_info min(threat_level_id) as threat_level_id by indicator indicator_type \
  | outputlookup tbcert_blocklist.csv
cron_schedule = 5,20,35,50 * * * *
enableSched = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now

# ---------------------------------------------------------------------------
# 3) SYNC — สร้าง/อัปเดต KV store tbcert_misp_ioc
#    วิธี A (ค่าเริ่มต้น): ใช้ข้อมูล MISP ที่ index ไว้แล้ว (index=main sourcetype=misp_events)
#    วิธี B: ดึงตรงด้วย MISP42Splunk (| mispgetioc) — ปิดไว้ เปิดใช้ทีละวิธีเท่านั้น
#    กรองความรุนแรงด้วย macro `tbcert_misp_severity_filter`
# ---------------------------------------------------------------------------
[TBCERT - Sync From Index - Incremental]
description = นำ IOC ทุกชนิดจาก sourcetype=misp_events ช่วง 20 นาทีล่าสุด เข้า KV store (upsert) รวมถึงถอด IOC ที่ปลด to_ids
search = `tbcert_misp_src` `tbcert_misp_severity_filter` \
| `tbcert_misp_events_normalize` \
| outputlookup append=true key_field=_key tbcert_misp_ioc_lookup
dispatch.earliest_time = -20m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1

[TBCERT - Sync From Index - Rebuild Nightly]
description = สร้าง KV store ใหม่ทั้งหมดจาก index (ล้าง IOC หมดอายุ/ไม่ผ่านเงื่อนไข) โดยเก็บ IOC ที่ดึงแบบระบุ event ไว้
search = `tbcert_misp_src` `tbcert_misp_severity_filter` \
| `tbcert_misp_events_normalize` \
| where status="active" \
| append [| inputlookup tbcert_misp_ioc_lookup where source="TB-CERT MISP (manual event)" | where expires > now()] \
| dedup _key \
| eventstats count(eval(source="TB-CERT MISP")) as total \
| where total >= `tbcert_min_rebuild_count` \
| fields - total \
| outputlookup override_if_empty=false tbcert_misp_ioc_lookup
dispatch.earliest_time = -400d
dispatch.latest_time = now
cron_schedule = 17 2 * * *
enableSched = 1

[TBCERT - Pull Specific Event IDs]
description = รันเองเมื่อ TB-CERT แจ้ง event สำคัญ — แก้ event_id ในวงเล็บแล้วกด Run (ไม่ผ่านตัวกรองความรุนแรง)
search = `tbcert_misp_src` event_id IN (558822) \
| `tbcert_misp_events_normalize` \
| eval source="TB-CERT MISP (manual event)" \
| outputlookup append=true key_field=_key tbcert_misp_ioc_lookup
dispatch.earliest_time = -400d
dispatch.latest_time = now
enableSched = 0

[TBCERT - MISP42Splunk Pull - Incremental]
description = (วิธี B) ดึงจาก MISP โดยตรงทุก 15 นาที รวม attribute ที่ถูกลบ/ปลด to_ids เพื่อถอดออก; threat_level_id ใส่หลายค่าได้ผ่าน json_request
search = | mispgetioc misp_instance=`tbcert_misp_instance` json_request="{\"timestamp\":\"1h\",\"threat_level_id\":[\"1\",\"2\",\"3\",\"4\"]}" type=`tbcert_misp_types` include_deleted=t warning_list=t expand_object=t pipesplit=f geteventtag=t include_sightings=f \
| `tbcert_misp_normalize` \
| outputlookup append=true key_field=_key tbcert_misp_ioc_lookup
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
disabled = 1

[TBCERT - MISP42Splunk Pull - Rebuild Nightly]
description = (วิธี B) สร้าง KV store ใหม่จาก MISP ทุกคืน
search = | mispgetioc misp_instance=`tbcert_misp_instance` json_request="{\"publish_timestamp\":\"365d\",\"threat_level_id\":[\"1\",\"2\",\"3\",\"4\"]}" type=`tbcert_misp_types` to_ids=t warning_list=t expand_object=t pipesplit=f geteventtag=t include_sightings=f not_tags="tlp:red" \
| `tbcert_misp_normalize` \
| where status="active" \
| append [| inputlookup tbcert_misp_ioc_lookup where source="TB-CERT MISP (manual event)" | where expires > now()] \
| dedup _key \
| eventstats count(eval(source="TB-CERT MISP")) as total \
| where total >= `tbcert_min_rebuild_count` \
| fields - total \
| outputlookup override_if_empty=false tbcert_misp_ioc_lookup
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = 17 2 * * *
enableSched = 1
disabled = 1

[TBCERT - MISP42Splunk Pull - Specific Event IDs]
description = (วิธี B) ดึง event ที่ระบุจาก MISP โดยตรง — eventid คั่นด้วย , (ใช้ ID หรือ UUID ก็ได้)
search = | mispgetioc misp_instance=`tbcert_misp_instance` eventid="558822" to_ids=t warning_list=t expand_object=t pipesplit=f geteventtag=t include_sightings=f \
| `tbcert_misp_normalize` \
| eval source="TB-CERT MISP (manual event)" \
| outputlookup append=true key_field=_key tbcert_misp_ioc_lookup
enableSched = 0
disabled = 1

[TBCERT - Sighting to TB-CERT]
description = ส่ง sighting กลับ MISP เมื่อพบ traffic ไปยัง IOC (ต้องได้รับอนุมัติก่อน เพราะเป็นการเปิดเผยว่าธนาคารพบ IOC)
search = | tstats summariesonly=true max(_time) as sight_ts from datamodel=Network_Traffic.All_Traffic by All_Traffic.dest \
| rename All_Traffic.dest AS indicator \
| lookup tbcert_misp_ioc_lookup indicator OUTPUTNEW indicator_type expires \
| where indicator_type="ip" AND expires > now() \
| eval sight_ts=round(sight_ts) \
| table sight_ts indicator
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = 7 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 1
alert.track = 0
action.misp_alert_sighting = 1
action.misp_alert_sighting.param.misp_instance = tbcert
action.misp_alert_sighting.param.title = Bank SOC sighting
action.misp_alert_sighting.param.description = Traffic observed to TB-CERT IOC
action.misp_alert_sighting.param.mode = byvalue
action.misp_alert_sighting.param.type = 0
action.misp_alert_sighting.param.timestamp = sight_ts
action.misp_alert_sighting.param.source = Bank SOC

# ---------------------------------------------------------------------------
# 4) HEALTH — แจ้งเตือนถ้ารอบ rebuild ไม่ได้ทำงาน (KV store ไม่ได้อัปเดตเกิน 26 ชั่วโมง)
# ---------------------------------------------------------------------------
[TBCERT - MISP Sync Health]
search = | inputlookup tbcert_misp_ioc_lookup \
| stats max(updated) as last_update count \
| where isnull(last_update) OR last_update < relative_time(now(), "-26h") \
| eval last_update=strftime(last_update, "%F %T")
cron_schedule = 0 * * * *
enableSched = 1
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
