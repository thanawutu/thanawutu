# ===========================================================================
#  ค่าที่ปรับได้ (ใช้กับวิธี MISP42Splunk)
# ===========================================================================
# ชื่อ instance ที่ตั้งไว้ในแอป MISP42Splunk (Configuration > MISP instances)
[tbcert_misp_instance]
definition = tbcert

# ชนิด IOC ที่ต้องการดึง — ครอบคลุม IOC ทุกกลุ่ม (network, web, file hash, email, host artefact)
# ชนิดที่ block ได้ (ip/domain/url/hash/email) จะถูกส่งออก blocklist ส่วนที่เหลือใช้ detect ใน Splunk
# ถ้าต้องการ "ทุก type" จริง ๆ ให้ลบ type=`tbcert_misp_types` ออกจาก saved search
[tbcert_misp_types]
definition = "ip-dst,ip-src,ip-dst|port,ip-src|port,domain,hostname,domain|ip,hostname|port,url,uri,link,md5,sha1,sha256,sha512,ssdeep,imphash,filename,filename|md5,filename|sha1,filename|sha256,filename|sha512,email-src,email-dst,email-subject,email-attachment,user-agent,ja3-fingerprint-md5,mutex,regkey,regkey|value,btc,AS"

# tag ที่ห้ามนำไป block (regex, ไม่สนตัวพิมพ์เล็ก/ใหญ่)
[tbcert_exclude_tag_regex]
definition = "(?i)^(tlp:red|false-positive|workflow:state=.incomplete.)$"

# TLP ที่อนุญาตให้ใช้ block ภายในธนาคาร
[tbcert_allowed_tlp_regex]
definition = "^(tlp:clear|tlp:white|tlp:green|tlp:amber|tlp:amber\+strict)$"

# อายุ IOC (วัน) นับจาก last_seen หรือเวลาแก้ไขล่าสุดใน MISP
[tbcert_ttl_ip]
definition = 30
[tbcert_ttl_domain]
definition = 90
[tbcert_ttl_url]
definition = 90
# hash ของ malware ไม่ค่อยเปลี่ยนความหมาย จึงให้อายุยาว
[tbcert_ttl_hash]
definition = 1825
[tbcert_ttl_email]
definition = 90
[tbcert_ttl_other]
definition = 90

# ---------------------------------------------------------------------------
# นโยบาย block vs detect (field action ใน KV store)
# ความเชื่อถือของ org ผู้แชร์อยู่ใน lookups/tbcert_org_trust.csv (คอลัมน์ org,trust,note)
#   trust=block  : IOC ทุกชนิดจาก org นี้ -> block
#   trust=recent : hash -> block, ip/domain/url/email -> block เฉพาะที่อายุไม่เกิน tbcert_block_max_age_days
#   trust=detect : ทุกชนิด -> detect เท่านั้น (ไม่ส่งไป firewall)
# org ที่ไม่อยู่ใน lookup ใช้ค่า tbcert_org_default_trust
# ดูรายชื่อ org: index=main sourcetype=misp_events | stats dc(value) by org
# ---------------------------------------------------------------------------
[tbcert_org_default_trust]
definition = "recent"

[tbcert_block_max_age_days]
definition = 14

# ถ้ารอบ rebuild ได้ IOC น้อยกว่านี้ จะถือว่าดึงผิดปกติและไม่เขียนทับรายการเดิม
[tbcert_min_rebuild_count]
definition = 50

# ===========================================================================
#  ข้อมูล MISP ที่ index ไว้แล้ว (index=main sourcetype=misp_events)
#  1 event ต่อ 1 attribute: event_id, uuid, info, threat_level_id, published,
#  event_tags[], record_type, object_name, attr_type, category, value, to_ids, attr_uuid, attr_timestamp
# ===========================================================================
[tbcert_misp_src]
definition = index=main sourcetype=misp_events published=true

# ระดับความรุนแรงที่จะนำเข้า blocklist (threat_level_id ของ event ใน MISP)
#   1 = High, 2 = Medium, 3 = Low, 4 = Undefined
#   ตัวอย่าง: เฉพาะ High+Medium -> threat_level_id IN (1,2)
[tbcert_misp_severity_filter]
definition = threat_level_id IN (1,2,3,4)

# แปลง field ของ sourcetype=misp_events ให้เป็นชื่อเดียวกับผลของ mispgetioc แล้วใช้ logic เดียวกัน
[tbcert_misp_events_normalize]
definition = dedup attr_uuid \
| rename attr_type AS misp_type, value AS misp_value, attr_uuid AS misp_attribute_uuid, event_id AS misp_event_id, uuid AS misp_event_uuid, info AS misp_event_info, category AS misp_category, "event_tags{}" AS misp_tag, attr_timestamp AS misp_timestamp, to_ids AS misp_to_ids \
| eval misp_comment=if(isnotnull(object_name), "object:".object_name, null()), threat_level_id=tonumber(threat_level_id) \
| `tbcert_misp_normalize`
iseval = 0

# ===========================================================================
#  แปลงผลจาก | mispgetioc ... pipesplit=f expand_object=t
#  ให้อยู่ในรูปแบบเดียวกับ KV store tbcert_misp_ioc
#  (detection search และ export_edl.py จึงใช้ร่วมกันได้ ไม่ว่าจะดึงด้วยวิธีไหน)
#
#  indicator_type: ip, domain, url, md5, sha1, sha256, sha512, email  (ชนิดที่ block ได้)
#                  หรือชื่อ type เดิมของ MISP เช่น filename, mutex, user-agent (ใช้ detect)
#  status = active                -> นำไป block
#  status = revoked:<เหตุผล>      -> expires ถูกตั้งเป็นอดีต จึงหลุดจาก blocklist ทันที
# ===========================================================================
[tbcert_misp_normalize]
definition = eval misp_type=lower(misp_type), now_ts=now() \
| eval comp=case(\
    in(misp_type,"ip-dst","ip-src","ip-dst|port","ip-src|port"), "ip:0:0",\
    in(misp_type,"domain","hostname","hostname|port"), "domain:0:0",\
    misp_type="domain|ip", mvappend("domain:0:0","ip:1:1"),\
    misp_type="url", "url:0:0",\
    in(misp_type,"md5","sha1","sha256","sha512"), misp_type.":0:0",\
    in(misp_type,"filename|md5","filename|sha1","filename|sha256","filename|sha512"), mvindex(split(misp_type,"|"),1).":1:0",\
    misp_type="email-src", "email:0:0",\
    true(), misp_type.":-1:0") \
| mvexpand comp \
| eval c=split(comp,":"), indicator_type=mvindex(c,0), vidx=tonumber(mvindex(c,1)), kidx=mvindex(c,2) \
| eval indicator=trim(if(vidx>=0 AND like(misp_type,"%|%"), mvindex(split(misp_value,"|"),vidx), misp_value)) \
| eval indicator=if(in(indicator_type,"domain","email","md5","sha1","sha256","sha512"), replace(lower(indicator),"\.$",""), indicator) \
| where isnotnull(indicator) AND indicator!="" \
| eval _key=misp_attribute_uuid.":".kidx \
| eval tags=misp_tag \
| eval tlp=lower(mvindex(mvfilter(match(tags,"(?i)^tlp:")),0)) \
| eval excluded=if(isnotnull(mvfind(tags, `tbcert_exclude_tag_regex`)),1,0) \
| eval tlp_ok=if(isnull(tlp) OR match(tlp, `tbcert_allowed_tlp_regex`),1,0) \
| eval private=if(indicator_type="ip" AND (cidrmatch("10.0.0.0/8",indicator) OR cidrmatch("172.16.0.0/12",indicator) OR cidrmatch("192.168.0.0/16",indicator) OR cidrmatch("127.0.0.0/8",indicator) OR cidrmatch("169.254.0.0/16",indicator) OR cidrmatch("100.64.0.0/10",indicator) OR cidrmatch("0.0.0.0/8",indicator) OR cidrmatch("224.0.0.0/3",indicator)),1,0) \
| lookup tbcert_allowlist_ip cidr AS indicator OUTPUT note AS allow_ip \
| eval host=case(indicator_type="domain", indicator, indicator_type="url", replace(lower(indicator),"^(?:[a-z][a-z0-9+.-]*://)?([^/:?#]+).*$","\1"), indicator_type="email", mvindex(split(indicator,"@"),-1)) \
| eval labels=split(host,"."), nl=mvcount(labels), li=mvrange(0,nl) \
| eval suffixes=mvmap(li, mvjoin(mvindex(labels, li, nl-1), ".")) \
| lookup tbcert_allowlist_domain domain AS suffixes OUTPUT note AS allow_dom \
| eval last_seen=coalesce(strptime(substr(misp_last_seen,1,19),"%Y-%m-%dT%H:%M:%S"), tonumber(misp_timestamp), now_ts) \
| eval first_seen=strptime(substr(misp_first_seen,1,19),"%Y-%m-%dT%H:%M:%S") \
| eval ttl_days=case(indicator_type="ip",`tbcert_ttl_ip`, indicator_type="domain",`tbcert_ttl_domain`, indicator_type="url",`tbcert_ttl_url`, indicator_type="email",`tbcert_ttl_email`, in(indicator_type,"md5","sha1","sha256","sha512"),`tbcert_ttl_hash`, true(),`tbcert_ttl_other`) \
| eval expires=round(last_seen + ttl_days*86400) \
| eval is_deleted=if(in(lower(tostring(misp_deleted)),"true","1"),1,0), is_ids=if(in(lower(tostring(misp_to_ids)),"true","1"),1,0) \
| eval status=case(is_deleted=1,"revoked:deleted", is_ids=0,"revoked:to_ids_off", excluded=1,"revoked:excluded_tag", tlp_ok=0,"revoked:tlp", private=1 OR isnotnull(allow_ip) OR isnotnull(allow_dom),"revoked:allowlist", expires<now_ts,"revoked:expired", true(),"active") \
| eval expires=if(status="active", expires, now_ts-1) \
| eval severity=case(threat_level_id=1,"high", threat_level_id=2,"medium", threat_level_id=3,"low", threat_level_id=4,"undefined") \
| lookup tbcert_org_trust org OUTPUT trust \
| eval trust=lower(coalesce(trust, `tbcert_org_default_trust`)) \
| eval action=case(status!="active","none", trust="detect","detect", trust="block","block", in(indicator_type,"md5","sha1","sha256","sha512"),"block", in(indicator_type,"ip","domain","url","email") AND now_ts-last_seen <= `tbcert_block_max_age_days`*86400,"block", true(),"detect") \
| eval updated=now_ts, source="TB-CERT MISP", category=misp_category, event_id=misp_event_id, event_uuid=misp_event_uuid, event_info=misp_event_info, attribute_uuid=misp_attribute_uuid, comment=misp_comment \
| dedup _key \
| table _key indicator indicator_type misp_type category event_id event_uuid event_info attribute_uuid comment tags tlp threat_level_id severity org trust source first_seen last_seen updated expires status action
iseval = 0

# index ที่ reconcile_misp_splunk.py ส่งผลเข้า (ตรงกับ hec_index ใน config.ini)
[tbcert_reconcile_index]
definition = index=threat_intel
