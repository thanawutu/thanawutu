# Registry of IPs blocked from Splunk, with the analyst's description.
# _key = <site_id>_<ip>
[imperva_block_registry]
field.site_id = string
field.ip = string
field.status = string
field.blocked_at = time
field.blocked_by = string
field.threat_actor = string
field.incident_no = string
field.comment = string
field.reason = string
field.source = string
field.unblocked_at = time
field.unblocked_by = string
field.unblock_reason = string
field.unblock_incident_no = string
accelerated_fields.ip_site = {"ip": 1, "site_id": 1}

# Detection rules: which ES correlation searches (search_name) feed the Block pages.
# Managed on the "Detection rules" dashboard (| impervarules). '*' = wildcard.
[imperva_ioc_rules]
field.pattern = string
field.mode = string
field.enabled = string
field.note = string
field.updated_by = string
field.updated_at = time

# Cache shared by all search heads of the cluster: VirusTotal results (vt_<ip>, 24 h)
# and the IP rules of every WAF policy (policies, 10 min). Written by vtcheck /
# impervapolicycheck and the warm-up saved searches; the dashboards only read it.
[imperva_cache]
field.ts = number
field.data = string

# WAF activity of the detected IPs in the last 24 h (from the Imperva logs), refreshed every
# 15 min by the saved search "Imperva - WAF activity of detected IPs (24h)"; the Block pages
# only look it up.
[imperva_ip_activity]
field.src = string
field.waf_blocked_24h = number
field.waf_allowed_24h = number
field.waf_other_24h = number
field.waf_web_blocked_24h = number
field.waf_web_allowed_24h = number
field.waf_events_24h = number
field.waf_last_seen = time
field.updated = time

# "Not block" decisions: IP hidden from the Block pages until detected again after dismissed_at
[imperva_ioc_dismissed]
field.ip = string
field.reason = string
field.incident_no = string
field.dismissed_by = string
field.dismissed_at = time

# WAF activity of the detected IPs over the last 30 days (Older detections page), refreshed
# hourly by "Imperva - WAF activity of detected IPs (30d)".
[imperva_ip_activity_30d]
field.src = string
field.waf_blocked_30d = number
field.waf_allowed_30d = number
field.waf_web_blocked_30d = number
field.waf_web_allowed_30d = number
field.waf_last_seen = time
field.updated = time

# Decision aid per detected IP (top attack types, HTTP codes let through, client, last hour),
# written by "Imperva - Decision aid of detected IPs (24h)" / "(30d)"
[imperva_ip_context_24h]
field.src = string
field.attack_types = string
field.allowed_codes = string
field.allowed_2xx = number
field.client = string
field.last_1h = number
field.events = number
field.updated = time

[imperva_ip_context_30d]
field.src = string
field.attack_types = string
field.allowed_codes = string
field.allowed_2xx = number
field.client = string
field.last_1h = number
field.events = number
field.updated = time

# V2 Auto unblock: per IP rule (_key e_<policy>_<cidr>): first_listed, rule (default | keep | days),
# and the document "settings" saved from the Auto unblock page
[imperva_auto_unblock]
field.policy_id = string
field.cidr = string
field.first_listed = number
field.rule = string
field.rule_by = string
field.rule_at = number
field.rule_reason = string
field.enabled = string
field.default_days = number
field.cloud_days = number
field.scope = string
field.max_per_run = number
field.updated_by = string
field.updated_at = number

# V2: last request the WAF blocked from each source IP (log "Blocked IP"), kept up to date every
# hour by "Imperva V2 - Last attack of blocked IPs (hourly)"
[imperva_blocked_seen]
field.src = string
field.last_seen = time
field.updated = time
