# Which ES findings (index=notable) feed the Block pages.
# The correlation-search names come from the KV store imperva_ioc_rules, managed on the
# "Detection rules" dashboard: enabled Include patterns minus enabled Exclude patterns.
# (index=notable is read directly - the ES `notable` macro fails on this ES 8 search head.)
[imperva_ioc_notables]
definition = index=notable [| impervarules action=terms mode=include] NOT [| impervarules action=terms mode=exclude]
iseval = 0
description = ES findings of the correlation searches selected on the Detection rules dashboard

# IP(s) of a finding -> ioc_ip (multivalue). Where the IP is depends on the correlation search:
#   WAF / threat-intel rules : src / src_ip, or threat_match_value (threat_match_field ip|src|dest|addr)
#   risk-based rules (e.g. "Threat - ... Threat Hunting (IP) ...") : ip, threat_object (threat_object_type=ip)
# Add other fields here if a new rule stores the IP elsewhere.
[imperva_ioc_ip]
definition = eval _tm_ip=if(match(lower(coalesce(threat_match_field, "")), "ip|src|dest|addr"), threat_match_value, null()) \
| eval _to_ip=if(lower(coalesce(threat_object_type, ""))="ip", threat_object, null()) \
| eval ioc_ip=mvdedup(mvappend(_tm_ip, _to_ip, ip, src, src_ip))
iseval = 0
description = IP(s) of an ES finding (src / src_ip / threat match / risk-based ip, threat_object)

# Maps each notable / finding to the columns shown on the dashboard.
# Incident no.: analysts write it in the finding's notes (ES 8 mc_notes), e.g.
#   "ITHM 1234567 | Sev 3 | <team> | WAF attack on <site> ..."
# The dashboard joins | impervanotes on source_guid -> field ithm; comment / note fields
# are also scanned. No ITHM yet -> "-". Shown as digits only ("ITHM 1234567" -> "1234567", 1.3.0).
[imperva_ioc_fields]
definition = eval ioc_notes_txt=mvjoin(mvappend(comment, note, notes), " || ") \
| rex field=ioc_notes_txt max_match=10 "(?i)(?<ioc_ithm>ITHM\s*-?\s*\d+)" \
| eval ioc_ithm=mvdedup(mvmap(ioc_ithm, "ITHM ".replace(ioc_ithm, "(?i)^ITHM\s*-?\s*", ""))) \
| eval ioc_rule=coalesce(rule_name, search_name, source), ioc_severity=coalesce(severity, urgency, priority), ioc_incident=coalesce(ithm, ioc_ithm, incident_no)
iseval = 0
description = Rule / severity / incident number of a notable for the Imperva IOC Block dashboard

# One row per detected public IP that is NOT blocked from Splunk, not "Not block"-ed since its
# last detection (KV imperva_ioc_dismissed), and that no ENABLED WAF
# policy blocks or allows (IP rules of every policy, cached / refreshed every 5 min):
# src rule_name incident_no severity first_seen last_seen notable_count ...
# The time range comes from the dashboard (7 days on the Block page, older on Older detections).
[imperva_ioc_detections]
definition = `imperva_ioc_notables` \
| eval _finding_guid=lower(coalesce(source_guid, mvindex(split(source_event_id, "@@"), 0))) \
| join type=left max=1 _finding_guid [| impervanotes | rename finding_guid AS _finding_guid | fields _finding_guid ithm] \
| `imperva_ioc_ip` \
| mvexpand ioc_ip \
| where isnotnull(ioc_ip) AND match(ioc_ip, "^[0-9A-Fa-f:.]+$") AND (match(ioc_ip, "^\d{1,3}(\.\d{1,3}){3}$") OR match(ioc_ip, ":")) \
| where NOT (cidrmatch("10.0.0.0/8", ioc_ip) OR cidrmatch("172.16.0.0/12", ioc_ip) OR cidrmatch("192.168.0.0/16", ioc_ip) OR cidrmatch("127.0.0.0/8", ioc_ip) OR cidrmatch("169.254.0.0/16", ioc_ip) OR cidrmatch("100.64.0.0/10", ioc_ip) OR cidrmatch("0.0.0.0/8", ioc_ip) OR cidrmatch("224.0.0.0/3", ioc_ip)) \
| `imperva_ioc_fields` \
| eval _sev_rank=case(lower(ioc_severity)="critical",5, lower(ioc_severity)="high",4, lower(ioc_severity)="medium",3, lower(ioc_severity)="low",2, in(lower(ioc_severity), "informational", "info"),1, true(),0) \
| stats count AS notable_count values(ioc_rule) AS rule_name values(ioc_incident) AS incident_no max(_sev_rank) AS _sev_rank min(_time) AS first_seen max(_time) AS last_seen BY ioc_ip \
| rename ioc_ip AS src \
| eval count=notable_count \
| lookup imperva_block_registry ip AS src OUTPUT status AS _reg_status \
| where isnull(mvfind(_reg_status, "^blocked$")) \
| lookup imperva_ioc_dismissed ip AS src OUTPUT dismissed_at AS _dismissed_at \
| where isnull(_dismissed_at) OR last_seen > tonumber(_dismissed_at) \
| eval severity=case(_sev_rank=5,"critical", _sev_rank=4,"high", _sev_rank=3,"medium", _sev_rank=2,"low", _sev_rank=1,"informational", true(),"-") \
| eval first_detected=strftime(first_seen, "%Y-%m-%d %H:%M"), last_detected=strftime(last_seen, "%Y-%m-%d %H:%M") \
| eval rule_name=mvjoin(rule_name, "; "), incident_no=coalesce(mvjoin(mvdedup(mvmap(incident_no, replace(incident_no, "(?i)ITHM\s*-?\s*", ""))), ", "), "-") \
| impervapolicycheck field=src \
| where waf_policy_verdict="NONE" OR waf_policy_verdict="UNKNOWN"
iseval = 0
description = Detected public IPs that no enabled WAF policy blocks or allows yet, from the selected ES findings

# VirusTotal, location and the Block suggestion for the detected IPs (shared by both tables).
[imperva_ioc_enrich_base]
definition = sort - _sev_rank - count | head 50 \
| vtcheck field=src count_field=count check_waf=false cache_only=true \
| iplocation src \
| eval location=trim(if(isnotnull(City) AND City!="", City.", ", "").coalesce(nullif(Country,""), "-")) \
| eval asn=if(isnull(vt_asn) OR vt_asn="-", "-", "AS".vt_asn." ".vt_as_owner) \
| eval vt_score=if(vt_status="ok", vt_malicious."/".vt_engines, vt_status) \
| eval prio=case(suggestion="BLOCK",1, suggestion="REVIEW",2, suggestion="MONITOR",3, suggestion="ALREADY_BLOCKED",4, true(),5) \
| sort prio - _sev_rank - last_seen \
| eval VirusTotal="🔗"
iseval = 0

# Block page table: WAF activity of the LAST 24 HOURS (KV imperva_ip_activity).
[imperva_ioc_enrich]
definition = `imperva_ioc_enrich_base` \
| lookup imperva_ip_activity src OUTPUT waf_blocked_24h waf_allowed_24h waf_web_blocked_24h waf_web_allowed_24h \
| eval waf_requests=coalesce(waf_blocked_24h, 0)." / ".coalesce(waf_allowed_24h, 0), waf_websites=coalesce(waf_web_blocked_24h, 0)." / ".coalesce(waf_web_allowed_24h, 0) \
| table src VirusTotal vt_score suggestion waf_requests waf_websites rule_name incident_no severity last_detected notable_count suggestion_reason location asn \
| rename waf_requests AS "Block / Allow (24h)", waf_websites AS "Web Block / Allow (24h)"
iseval = 0

# Older detections table: WAF activity of the LAST 30 DAYS + last time seen on the WAF
# (KV imperva_ip_activity_30d). "-" = no WAF request in 30 days (the IP went quiet).
[imperva_ioc_enrich_30d]
definition = `imperva_ioc_enrich_base` \
| lookup imperva_ip_activity_30d src OUTPUT waf_blocked_30d waf_allowed_30d waf_web_blocked_30d waf_web_allowed_30d waf_last_seen \
| eval waf_requests=coalesce(waf_blocked_30d, 0)." / ".coalesce(waf_allowed_30d, 0), waf_websites=coalesce(waf_web_blocked_30d, 0)." / ".coalesce(waf_web_allowed_30d, 0), waf_last_seen=if(isnum(tonumber(waf_last_seen)), strftime(tonumber(waf_last_seen), "%Y-%m-%d %H:%M"), "-") \
| table src VirusTotal vt_score suggestion waf_requests waf_websites waf_last_seen rule_name incident_no severity last_detected notable_count suggestion_reason location asn \
| rename waf_requests AS "Block / Allow (30d)", waf_websites AS "Web Block / Allow (30d)", waf_last_seen AS "WAF last seen"
iseval = 0

# Search terms (src="a") OR (src="b") ... of the IPs detected in the last <days> days, used by
# the WAF-activity saved searches to read only those IPs from the Imperva logs.
[imperva_ioc_detected_ip_terms(1)]
args = days
definition = `imperva_ioc_notables` earliest=-$days$d@d \
| `imperva_ioc_ip` \
| mvexpand ioc_ip \
| where isnotnull(ioc_ip) AND (match(ioc_ip, "^\d{1,3}(\.\d{1,3}){3}\z") OR match(ioc_ip, ":")) \
| stats count BY ioc_ip | rename ioc_ip AS src | fields src
iseval = 0

# Append the result rows of impervablock / impervarules to the audit CSV (lookup imperva_audit)
# and show them. Columns: time user action ip ticket description status verified policy backend soar_container detail
[imperva_audit_write]
definition = eval time=coalesce(_time, now()), ticket=coalesce(nullif(incident_no, ""), "-"), description=coalesce(nullif(comment, ""), nullif(reason, ""), "-"), verified=coalesce(verified_in_waf, "-"), policy=coalesce(site_id, "-"), backend=coalesce(backend, "-"), soar_container=coalesce(soar_container, "-") \
| table time user action ip ticket description status verified policy backend soar_container detail \
| outputlookup append=true imperva_audit \
| eval time=strftime(time, "%Y-%m-%d %H:%M:%S")
iseval = 0

# Audit rows (block / unblock) of the last <days> days as one row per day:
# _time "Blocked IPs" "Unblocked IPs" - days without changes are 0.
[imperva_audit_daily(1)]
args = days
definition = inputlookup imperva_audit \
| eval _time=tonumber(time) \
| where (status="blocked" OR status="unblocked") AND _time>=relative_time(now(), "@d")-($days$-1)*86400 \
| eval series=if(status="blocked", "Blocked IPs", "Unblocked IPs") \
| append [| makeresults count=$days$ | streamstats count AS _n | eval _time=relative_time(now(), "@d")-(_n-1)*86400, series=split("Blocked IPs,Unblocked IPs", ",") | mvexpand series | fields _time series] \
| bin _time span=1d \
| stats dc(ip) AS n BY _time series \
| xyseries _time series n \
| fillnull value=0 "Blocked IPs" "Unblocked IPs" \
| sort 0 _time
iseval = 0

# Imperva Cloud WAF logs (used for the per-IP WAF activity of the last 24 h)
[imperva_waf_events]
definition = index=imperva sourcetype="incapsula:cef"
iseval = 0
description = Imperva Cloud WAF events (CEF)

# What the WAF did with a request -> waf_class = blocked | allowed | other.
# Incapsula CEF field act (values seen on this WAF):
#   blocked: REQ_BLOCKED_* (COOKIELESS_SESSION, VISITOR, SECURITY, SESSION, ACL), REQ_NON_SNI_FORBIDDEN
#   allowed: REQ_PASSED, REQ_CACHED_* (served from the Imperva cache)
#   other:   REQ_BAD_* (connection / parse / timeout problems - not a WAF decision)
[imperva_waf_action_class]
definition = eval _act=lower(coalesce(act, action, "")) \
| eval waf_class=case(like(_act, "req_blocked%") OR _act="req_non_sni_forbidden" OR _act="blocked", "blocked", \
    _act="req_passed" OR like(_act, "req_cached%") OR _act="allowed", "allowed", \
    true(), "other")
iseval = 0
description = Classify Imperva WAF events as blocked / allowed / other

# ============================================================================================
# Decision aid (added in 1.3.0). Nothing above is changed by it.
# ============================================================================================

# Cloud providers (shared / re-assigned IPs): blocked for a short time only - Auto unblock removes
# them after [auto_unblock] cloud_days without an attack. Matched in the VirusTotal AS owner, whole
# words. Keep in step with imperva.conf cloud_providers. Use: match(lower(asn), `imperva_cloud_providers`)
[imperva_cloud_providers]
definition = "\b(amazon|aws|google|microsoft|azure|cloudflare|akamai|fastly|oracle|alibaba|tencent|ibm)\b"
iseval = 0
description = Regex: AS owner words of cloud providers (short block, auto unblock)

# Mobile operators: many customers share one IP (carrier NAT) -> blocking may hit customers
[imperva_mobile_providers]
definition = "\b(mobile|wireless|cellular|airtel|jio|vodafone|telkomsel|viettel|real move|true move|total access|dtac)\b"
iseval = 0
description = Regex: AS owner words of mobile operators (shared IPs)

# Hosting / VPS providers (an IP usually belongs to one tenant)
[imperva_hosting_providers]
definition = "\b(hosting|host|vps|servers?|data ?cent(er|re)|cloud|digitalocean|ovh|hetzner|linode|vultr|contabo|m247|leaseweb|choopa|colocrossing|scaleway|ionos|kamatera|psychz|quadranet|selectel|timeweb|aeza|stark industries|ip volume|alsycon|media land|global layer|censys|shodan|ucloud|hostinger|godaddy)\b"
iseval = 0
description = Regex: AS owner words of hosting / VPS providers

# Request details of an Imperva event (several field names are tried, the first one that exists wins):
#   waf_path   host + path without the query string (request / url / uri_path / uri, host from dest_name)
#   waf_code   HTTP response code     waf_ua   User-Agent     waf_client   Imperva client type · app
#   waf_atk    attack type (cef_name, "-" for Normal traffic)
[imperva_waf_request_fields]
definition = eval _host=coalesce(dest_name, sourceServiceName, dest_host, dest, "") \
| eval _url=coalesce(request, url, uri_path, uri, "") \
| eval _url=replace(replace(_url, "^[A-Za-z]+://", ""), "[?#].*", "") \
| eval waf_path=case(_url="", "-", match(_url, "^/"), _host._url, true(), _url) \
| eval waf_code=coalesce(Response_Code, cn1, status, http_status, response_code, "-") \
| eval waf_ua=coalesce(requestClientApplication, http_user_agent, user_agent, "-") \
| eval _ct=coalesce(Browser_Type, dproc, client_type, ""), _ca=coalesce(clapp, Client_App, Client_Application, "") \
| eval waf_client=case(_ct!="" AND _ca!="", _ct." · "._ca, _ct!="", _ct, _ca!="", _ca, true(), "-") \
| eval waf_atk=if(isnotnull(cef_name) AND cef_name!="" AND cef_name!="Normal", cef_name, "-")
iseval = 0
description = Path / response code / User-Agent / client / attack type of an Imperva event

# "Decision aid (24h|30d)" column, added after `imperva_ioc_enrich` / `imperva_ioc_enrich_30d`:
# owner of the IP, warning signals and "🔎 detail" (click = IP detail panel). Context from the
# saved searches "Imperva - Decision aid of detected IPs (24h|30d)" (KV imperva_ip_context_<win>),
# block / unblock / not block history from the audit CSV.
# V2: cloud provider IPs may be blocked (Auto unblock removes them after a short quiet period).
# The lines are built as one "a|b|c" string and split: mvappend() fails ("arguments are invalid")
# when Splunk folds a condition to a literal null(), e.g. the 1-hour signal on the 30d page.
[imperva_ioc_decision_aid(1)]
args = win
definition = lookup imperva_ip_context_$win$ src OUTPUT attack_types AS _atk allowed_2xx AS _ok2xx client AS _client last_1h AS _h1 \
| lookup imperva_audit ip AS src OUTPUT action AS _audit_action \
| eval _own=lower(coalesce(asn, "")), _cl=lower(coalesce(_client, "")) \
| eval _cloud=if(match(_own, `imperva_cloud_providers`), replace(asn, "^AS\d+\s+", ""), null()) \
| eval _owner=case(isnotnull(_cloud), "Cloud provider · shared IP", \
    match(_cl, "search bot|crawler"), "Crawler (verified by Imperva)", \
    match(_own, `imperva_mobile_providers`), "Mobile ISP · shared IP", \
    match(_own, `imperva_hosting_providers`), "Hosting / VPS", \
    _own="" OR _own="-", "Owner unknown (VT pending)", \
    true(), "ISP / other") \
| eval suggestion_reason=if(isnotnull(_cloud), "cloud provider IP (". _cloud.") - short block, auto unblock after a few quiet days; ".suggestion_reason, suggestion_reason) \
| eval _win="$win$", _n2xx=coalesce(tonumber(_ok2xx), 0), _nh1=coalesce(tonumber(_h1), 0) \
| eval _sig=if(isnotnull(_cloud), "☁ cloud provider - short block (auto unblock)|", "") \
    .if(like(_owner, "Mobile%"), "⚠ shared IP - may hit customers|", "") \
    .if(like(_owner, "Crawler%"), "✔ crawler verified by Imperva|", "") \
    .if(coalesce(_atk, "")!="" AND _n2xx>0, "⚠ attacks + allowed 2xx ×"._n2xx."|", "") \
    .if(_win="24h" AND _nh1>0, "● active now · 1h: "._nh1."|", "") \
    .if(isnotnull(mvfind(_audit_action, "^unblock")), "↺ unblocked before|", "") \
    .if(isnotnull(mvfind(_audit_action, "^not_block")), "✖ not blocked before|", "") \
| eval decision_aid=split(_owner."|"._sig."🔎 detail", "|") \
| rename decision_aid AS "Decision aid ($win$)"
iseval = 0
description = Decision aid column (owner, signals) for the detection tables
