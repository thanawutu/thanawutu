[install]
is_configured = false
# raise on every change of appserver/static/*.js so browsers load the new files
build = 3

[ui]
is_visible = true
label = Imperva IOC Block V2

[launcher]
author = thanawutu
description = V2 of Imperva IOC Block: block / unblock IP IOCs on Imperva Cloud WAF and unblock them automatically after a quiet period. Runs next to V1 until V1 is removed.
version = 2.0.2

[package]
id = TA-imperva-ioc-block-v2
check_for_updates = false

# imperva.conf changes (e.g. protected_networks) are re-read on every command run,
# so a deployer push does not need a rolling restart.
[triggers]
reload.imperva = simple
