# Looks up EVERY detected IP (last 30 days, not blocked yet) on VirusTotal and keeps the
# results in the 24 h cache, so the Block pages open fast and show a VT score for all IPs.
# No lookup limit per run (max_lookups=0). When VirusTotal answers HTTP 429 (quota) it waits
# rate_limit_retry_seconds and calls again, for up to 25 min per run; IPs still left are
# picked up by the next run (every 10 min). Through SOAR when [virustotal] vt_via = auto/soar.
[Imperva V2 - VT cache warm-up]
disabled = 0
enableSched = 1
cron_schedule = */10 * * * *
schedule_window = 5
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
dispatch.max_time = 1800
search = `imperva_ioc_detections` \
| sort - count \
| vtcheck field=src count_field=count check_waf=false max_lookups=0 max_wait=1500 \
| stats count AS ips count(eval(vt_status="ok" OR vt_status="not_found")) AS checked count(eval(like(vt_status, "rate_limited%") OR like(vt_status, "not_checked%"))) AS pending

# Run ONCE after installing this version (Settings > Searches, reports, and alerts > Run):
# copies block / unblock history from the old log (index=_internal, last 90 days) into the
# audit CSV (lookup imperva_audit) so the Audit log page and the charts include it.
# Disabled by default so it is not run twice by mistake (it appends): enable, run once, disable.
[Imperva V2 - audit CSV backfill from log (run once)]
disabled = 1
enableSched = 0
dispatch.earliest_time = -90d@d
dispatch.latest_time = now
search = index=_internal source=*imperva_ioc_block.log NOT source=*v2_imperva_ioc_block.log (status=blocked OR status=unblocked) dry_run=False \
| eval time=_time, ticket=coalesce(nullif(incident_no, ""), "-"), description=coalesce(nullif(comment, ""), nullif(reason, ""), "-"), verified=coalesce(verified_in_waf, "-"), policy=coalesce(site_id, "-"), backend=coalesce(backend, "-"), soar_container=coalesce(soar_container, "-") \
| table time user action ip ticket description status verified policy backend soar_container detail \
| sort 0 time \
| outputlookup append=true imperva_audit

# Keeps the WAF-policy cache (IP rules of every policy, KV store imperva_cache) fresh,
# so the Block pages never wait for SOAR / Imperva to check "allowed / blocked elsewhere".
[Imperva V2 - WAF policy cache refresh]
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = 2
dispatch.earliest_time = -1m
dispatch.latest_time = now
search = | makeresults | impervapolicycheck action=refresh | table policies_ip_rules read_via

# Requests of each detected IP that the WAF blocked / allowed in the LAST 24 HOURS, and on how
# many websites (dest_name). KV store imperva_ip_activity -> Block page columns
# "Block / Allow (24h)" and "Web Block / Allow (24h)". IPs detected in the last 30 days.
[Imperva V2 - WAF activity of detected IPs (24h)]
disabled = 0
enableSched = 1
cron_schedule = */15 * * * *
schedule_window = 5
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.max_time = 900
search = `imperva_waf_events` [ search `imperva_ioc_detected_ip_terms(30)` ] \
| `imperva_waf_action_class` \
| eval _site=coalesce(dest_name, sourceServiceName, dest_host, dest, "-") \
| stats count(eval(waf_class="blocked")) AS waf_blocked_24h count(eval(waf_class="allowed")) AS waf_allowed_24h count(eval(waf_class="other")) AS waf_other_24h dc(eval(if(waf_class="blocked", _site, null()))) AS waf_web_blocked_24h dc(eval(if(waf_class="allowed", _site, null()))) AS waf_web_allowed_24h count AS waf_events_24h max(_time) AS waf_last_seen BY src \
| eval _key=replace(src, ":", "-"), updated=now() \
| outputlookup imperva_ip_activity

# Same over the LAST 30 DAYS + when the IP was last seen on the WAF, for the Older detections
# page (IPs detected in the last 90 days). Hourly: 30 days of WAF logs is a heavier search.
# KV store imperva_ip_activity_30d -> "Block / Allow (30d)", "Web Block / Allow (30d)", "WAF last seen".
[Imperva V2 - WAF activity of detected IPs (30d)]
disabled = 0
enableSched = 1
cron_schedule = 7 * * * *
schedule_window = 15
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
dispatch.max_time = 3000
search = `imperva_waf_events` [ search `imperva_ioc_detected_ip_terms(90)` ] \
| `imperva_waf_action_class` \
| eval _site=coalesce(dest_name, sourceServiceName, dest_host, dest, "-") \
| stats count(eval(waf_class="blocked")) AS waf_blocked_30d count(eval(waf_class="allowed")) AS waf_allowed_30d dc(eval(if(waf_class="blocked", _site, null()))) AS waf_web_blocked_30d dc(eval(if(waf_class="allowed", _site, null()))) AS waf_web_allowed_30d max(_time) AS waf_last_seen BY src \
| eval _key=replace(src, ":", "-"), updated=now() \
| outputlookup imperva_ip_activity_30d

# ============================================================================================
# Decision aid (added in 1.3.0). The saved searches above are not changed.
# ============================================================================================

# Per detected IP over the LAST 24 HOURS of Imperva logs: top attack types, HTTP codes of the
# requests let through, client (Imperva client type / app), requests in the last hour.
# KV imperva_ip_context_24h -> "Decision aid (24h)" column of the Block page. Runs 5 min after
# "WAF activity (24h)" so the two do not read the logs at the same time.
[Imperva V2 - Decision aid of detected IPs (24h)]
disabled = 0
enableSched = 1
cron_schedule = 5-59/15 * * * *
schedule_window = 5
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.max_time = 900
search = `imperva_waf_events` [ search `imperva_ioc_detected_ip_terms(30)` ] \
| `imperva_waf_action_class` \
| `imperva_waf_request_fields` \
| eval _h1=if(_time>=relative_time(now(), "-1h"), 1, 0), _ok=if(waf_class="allowed" AND match(waf_code, "^2"), 1, 0) \
| stats count AS n sum(_h1) AS h1 sum(_ok) AS ok BY src waf_class waf_atk waf_code waf_client \
| eval kk=mvappend(if(waf_atk!="-", "atk|".waf_atk, null()), if(waf_class="allowed", "code|".waf_code, null()), if(waf_client!="-", "client|".waf_client, null()), "all|-") \
| mvexpand kk \
| stats sum(n) AS c sum(h1) AS h1 sum(ok) AS ok BY src kk \
| rex field=kk "^(?<kind>[^|]+)\|(?<kname>.*)" \
| sort 0 src kind -c \
| streamstats count AS rank BY src kind \
| eval txt=if(kind!="all" AND rank<=3, kname." ".c, null()) \
| eval all_h1=if(kind="all", h1, 0), all_ok=if(kind="all", ok, 0), all_c=if(kind="all", c, 0), atk_txt=if(kind="atk", txt, null()), code_txt=if(kind="code", txt, null()), client_txt=if(kind="client", txt, null()) \
| stats sum(all_h1) AS last_1h sum(all_ok) AS allowed_2xx sum(all_c) AS events list(atk_txt) AS attack_types list(code_txt) AS allowed_codes list(client_txt) AS client BY src \
| eval attack_types=coalesce(mvjoin(attack_types, "; "), ""), allowed_codes=coalesce(mvjoin(allowed_codes, "; "), ""), client=coalesce(mvindex(client, 0), "") \
| eval _key=replace(src, ":", "-"), updated=now() \
| outputlookup imperva_ip_context_24h

# Same over the LAST 30 DAYS for the Older detections page (IPs detected in the last 90 days),
# every 4 hours (30 days of logs). KV imperva_ip_context_30d -> "Decision aid (30d)".
[Imperva V2 - Decision aid of detected IPs (30d)]
disabled = 0
enableSched = 1
cron_schedule = 37 */4 * * *
schedule_window = 30
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
dispatch.max_time = 3000
search = `imperva_waf_events` [ search `imperva_ioc_detected_ip_terms(90)` ] \
| `imperva_waf_action_class` \
| `imperva_waf_request_fields` \
| eval _h1=0, _ok=if(waf_class="allowed" AND match(waf_code, "^2"), 1, 0) \
| stats count AS n sum(_h1) AS h1 sum(_ok) AS ok BY src waf_class waf_atk waf_code waf_client \
| eval kk=mvappend(if(waf_atk!="-", "atk|".waf_atk, null()), if(waf_class="allowed", "code|".waf_code, null()), if(waf_client!="-", "client|".waf_client, null()), "all|-") \
| mvexpand kk \
| stats sum(n) AS c sum(h1) AS h1 sum(ok) AS ok BY src kk \
| rex field=kk "^(?<kind>[^|]+)\|(?<kname>.*)" \
| sort 0 src kind -c \
| streamstats count AS rank BY src kind \
| eval txt=if(kind!="all" AND rank<=3, kname." ".c, null()) \
| eval all_h1=if(kind="all", h1, 0), all_ok=if(kind="all", ok, 0), all_c=if(kind="all", c, 0), atk_txt=if(kind="atk", txt, null()), code_txt=if(kind="code", txt, null()), client_txt=if(kind="client", txt, null()) \
| stats sum(all_h1) AS last_1h sum(all_ok) AS allowed_2xx sum(all_c) AS events list(atk_txt) AS attack_types list(code_txt) AS allowed_codes list(client_txt) AS client BY src \
| eval attack_types=coalesce(mvjoin(attack_types, "; "), ""), allowed_codes=coalesce(mvjoin(allowed_codes, "; "), ""), client=coalesce(mvindex(client, 0), "") \
| eval _key=replace(src, ":", "-"), updated=now() \
| outputlookup imperva_ip_context_30d

# ============================================================================================
# Auto unblock (V2)
# ============================================================================================

# Last request the WAF blocked from each source IP (Imperva "Blocked IP" = the IP is on a block list
# and still sends requests). Merged into KV imperva_blocked_seen; Auto unblock counts the quiet days
# from it. Kept 400 days.
[Imperva V2 - Last attack of blocked IPs (hourly)]
disabled = 0
enableSched = 1
cron_schedule = 3 * * * *
schedule_window = 10
dispatch.earliest_time = -65m@m
dispatch.latest_time = @m
dispatch.max_time = 900
search = `imperva_waf_events` (cef_name="Blocked IP" OR act="REQ_BLOCKED_ACL") \
| stats max(_time) AS last_seen BY src \
| append [| inputlookup imperva_blocked_seen | fields src last_seen] \
| stats max(last_seen) AS last_seen BY src \
| where isnotnull(src) AND last_seen>=relative_time(now(), "-400d") \
| eval _key=replace(src, ":", "-"), updated=now() \
| outputlookup imperva_blocked_seen

# Unblock the IP rules that are due: no request for [auto_unblock] cloud_days (cloud provider IPs, 7)
# or default_days (others, 90), counted from the latest of: last request, block date, the day V2 first
# saw the rule. Every policy when scope = all (IDs in IMPERVA_POLICY_IDS on SOAR). Audit CSV + registry.
[Imperva V2 - Auto unblock (daily)]
disabled = 0
enableSched = 1
cron_schedule = 17 2 * * *
schedule_window = 30
dispatch.earliest_time = -1m
dispatch.latest_time = now
dispatch.max_time = 3000
search = | makeresults | impervaautounblock action=run | `imperva_audit_write`

# Optional, run once right after installing: last requests of the last 7 days, so the Auto unblock
# page shows "Last attack" at once (the countdown still starts at the install day).
[Imperva V2 - Last attack backfill 7 days (run once)]
disabled = 1
enableSched = 0
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
search = `imperva_waf_events` (cef_name="Blocked IP" OR act="REQ_BLOCKED_ACL") \
| stats max(_time) AS last_seen BY src \
| append [| inputlookup imperva_blocked_seen | fields src last_seen] \
| stats max(last_seen) AS last_seen BY src \
| eval _key=replace(src, ":", "-"), updated=now() \
| outputlookup imperva_blocked_seen

# Run once after installing V2: copies V1 (TA-imperva-ioc-block) data into V2 - block registry,
# detection rules, Not block list, VirusTotal cache (KV store) and the credentials (SOAR token,
# Imperva / VirusTotal keys). Secrets are copied server side, never shown. Enable, Run, disable.
[Imperva V2 - Import data from V1 (run once)]
disabled = 1
enableSched = 0
dispatch.earliest_time = -1m
dispatch.latest_time = now
search = | impervav1import action=kv \
| append [| impervav1import action=credentials] \
| table what items status detail

# Run once after installing V2: copies the V1 audit log (block / unblock history) into the V2 audit
# CSV, skipping rows already there. Enable, Run, disable.
[Imperva V2 - Import audit log from V1 (run once)]
disabled = 1
enableSched = 0
dispatch.earliest_time = -1m
dispatch.latest_time = now
search = | impervav1import action=audit \
| outputlookup append=true imperva_audit \
| stats count AS imported_rows
