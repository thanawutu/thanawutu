# Registry of IPs blocked from Splunk, with the analyst's description.
# _key = <site_id>_<ip>
[imperva_block_registry]
field.site_id = string
field.ip = string
field.status = string
field.blocked_at = time
field.blocked_by = string
field.threat_actor = string
field.incident_no = string
field.comment = string
field.reason = string
field.source = string
field.unblocked_at = time
field.unblocked_by = string
field.unblock_reason = string
field.unblock_incident_no = string
accelerated_fields.ip_site = {"ip": 1, "site_id": 1}

# Detection rules: which ES correlation searches (search_name) feed the Block pages.
# Managed on the "Detection rules" dashboard (| impervarules). '*' = wildcard.
[imperva_ioc_rules]
field.pattern = string
field.mode = string
field.enabled = string
field.note = string
field.updated_by = string
field.updated_at = time
