# Which ES notable events feed the "Detected IOCs" table on the dashboard.
# Default: all notables (ES `notable` macro adds urgency / status_label).
# Examples to narrow it (edit in Settings > Advanced search > Search macros, or local/macros.conf):
#   `notable` | search search_name="Threat - Threat List Activity - Rule"
#   `notable` | search status_label!="Closed"
#   index=notable            (without ES enrichment: no urgency / status)
[imperva_ioc_notables]
definition = `notable`
iseval = 0
description = ES notable events whose IOC IPs are listed on the Imperva IOC Block dashboard
