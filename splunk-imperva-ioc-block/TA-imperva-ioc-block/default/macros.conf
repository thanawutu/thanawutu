# Which ES notable events feed the "Detected IOCs" table on the dashboard.
# Default: notables of every correlation search whose name contains WAF
# (ES `notable` macro adds urgency / status_label).
# Examples to narrow it (edit in Settings > Advanced search > Search macros, or local/macros.conf):
#   `notable` | search search_name="Threat - Threat List Activity - Rule"
#   `notable` | search status_label!="Closed"
#   index=notable            (without ES enrichment: no urgency / status)
[imperva_ioc_notables]
definition = `notable` | search search_name="*WAF*"
iseval = 0
description = ES notable events whose IOC IPs are listed on the Imperva IOC Block dashboard

# Maps each notable to the columns shown on the dashboard. Adjust the field names if your
# correlation searches / incident integration use different ones, e.g.
#   ioc_incident=coalesce(snow_incident, incident_number, event_id)
[imperva_ioc_fields]
definition = eval ioc_rule=coalesce(rule_name, search_name, source), ioc_severity=coalesce(urgency, severity, priority), ioc_incident=coalesce(incident_no, incident_number, ticket_id, display_id, event_id)
iseval = 0
description = Rule / severity / incident number of a notable for the Imperva IOC Block dashboard
