[install]
is_configured = false

[ui]
is_visible = true
label = Imperva IOC Block

[launcher]
author = thanawutu
description = Manually block / unblock malicious IP IOCs on Imperva Cloud WAF from a Splunk dashboard button.
version = 1.0.0

[package]
id = TA-imperva-ioc-block
check_for_updates = false

# imperva.conf changes (e.g. protected_networks) are re-read on every command run,
# so a deployer push does not need a rolling restart.
[triggers]
reload.imperva = simple
