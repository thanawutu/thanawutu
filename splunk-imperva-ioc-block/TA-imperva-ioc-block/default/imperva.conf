# Copy to local/imperva.conf and edit. Never edit default/.
[settings]
# v2_policy (default): block IPs in an Imperva ACL *policy* via the Policies API v2
#                      https://api.imperva.com/policies/v2/policies/{policyId}
#                      -> one write applies to every site/account the policy is assigned to
# v1_site:             legacy per-site ACL "Blacklisted IPs" via /api/prov/v1/sites/configure/acl
# soar:                Search Head has NO route to Imperva -> send the request to Splunk SOAR,
#                      whose playbook "imperva_ioc_block" calls the Policies API v2 (see soar/README)
api_mode = v2_policy

# ---- v2_policy ----
api_v2_base_url = https://api.imperva.com
# Comma separated ACL policy IDs (Cloud Security Console > Policies) that hold the IP BLOCK list
policy_ids =
# Optional: sub-account id (caid) if the API key belongs to a parent account
caid =

# ---- soar ----
# SOAR base URL reachable from the Search Head; token in storage/passwords realm "splunk_soar"
soar_url =
soar_label = imperva_ioc_block
soar_verify_ssl = true
# PEM file of the internal CA that signed the SOAR certificate (absolute path, or relative
# to the app directory, e.g. local/soar_ca.pem). Keeps verification on without trusting it system-wide.
soar_ca_file =
soar_proxy =
# how long a Splunk search waits for the playbook result
soar_wait_seconds = 90
# delete the short-lived containers created by "| impervalist" (block/unblock containers are kept as audit trail)
soar_delete_list_containers = true

# ---- v1_site ----
api_base_url = https://my.imperva.com
site_ids =
# Safety guards
max_ips_per_action = 50
max_cidr_prefix_v4 = 24
max_cidr_prefix_v6 = 48
# IPs / CIDRs that must NEVER be blocked (own egress, partners, scanners, monitoring, ...)
protected_networks =
# Optional outbound proxy, e.g. http://proxy.corp:8080
proxy =
verify_ssl = true
timeout = 30

[virustotal]
# auto   = through SOAR when [settings] api_mode = soar, otherwise direct from the Search Head
# direct = Search Head calls VirusTotal (key in storage/passwords realm "virustotal")
# soar   = SOAR playbook calls VirusTotal (VT_API_KEY env var on SOAR; no VT key on Splunk)
vt_via = auto
api_base_url = https://www.virustotal.com/api/v3
# Public (free) API = 4 req/min, 500/day. Raise for a premium key.
requests_per_minute = 4
# New (uncached) VT lookups per search run; the rest show "not_checked"
max_lookups_per_run = 10
cache_ttl_hours = 24
timeout = 30
verify_ssl = true
proxy =
# Suggestion thresholds
block_malicious = 3
review_malicious = 1
review_suspicious = 2
high_volume_count = 1000
