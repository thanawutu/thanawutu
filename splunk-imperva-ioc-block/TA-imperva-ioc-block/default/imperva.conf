# Copy to local/imperva.conf and edit. Never edit default/.
[settings]
# Imperva Cloud WAF API base URL
api_base_url = https://my.imperva.com
# Comma separated Imperva site IDs whose ACL blacklist will be updated
site_ids =
# Safety guards
max_ips_per_action = 50
max_cidr_prefix_v4 = 24
max_cidr_prefix_v6 = 48
# IPs / CIDRs that must NEVER be blocked (own egress, partners, scanners, monitoring, ...)
protected_networks =
# Optional outbound proxy, e.g. http://proxy.corp:8080
proxy =
verify_ssl = true
timeout = 30
