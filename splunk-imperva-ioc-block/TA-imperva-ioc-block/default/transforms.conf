[malicious_ip_iocs]
filename = malicious_ip_iocs.csv

[imperva_block_registry]
external_type = kvstore
collection = imperva_block_registry
fields_list = _key, site_id, ip, status, blocked_at, blocked_by, threat_actor, incident_no, comment, reason, source, unblocked_at, unblocked_by, unblock_reason, unblock_incident_no

[imperva_ip_activity]
external_type = kvstore
collection = imperva_ip_activity
fields_list = _key, src, waf_blocked_24h, waf_allowed_24h, waf_other_24h, waf_web_blocked_24h, waf_web_allowed_24h, waf_events_24h, waf_last_seen, updated

[imperva_ioc_dismissed]
external_type = kvstore
collection = imperva_ioc_dismissed
fields_list = _key, ip, reason, incident_no, dismissed_by, dismissed_at

[imperva_ip_activity_30d]
external_type = kvstore
collection = imperva_ip_activity_30d
fields_list = _key, src, waf_blocked_30d, waf_allowed_30d, waf_web_blocked_30d, waf_web_allowed_30d, waf_last_seen, updated

[imperva_ioc_rules]
external_type = kvstore
collection = imperva_ioc_rules
fields_list = _key, pattern, mode, enabled, note, updated_by, updated_at

# Audit log of every Block / Unblock / Detection-rule change (written by the dashboards
# with `imperva_audit_write`). The file is NOT shipped with the app, so an app update
# never overwrites it; it is created by the first write (see README: install step).
[imperva_audit]
filename = imperva_audit.csv
