# Optional: warms the VirusTotal cache every 30 min so the dashboard opens instantly.
# Enable it in Settings > Searches, reports, and alerts (runs as its owner - needs imperva_blocker).
[Imperva - VT cache warm-up]
disabled = 1
enableSched = 1
cron_schedule = */30 * * * *
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
search = `imperva_ioc_notables` \
| eval ioc_ip=mvdedup(mvappend(if(match(lower(coalesce(threat_match_field, "")), "ip|src|dest|addr"), threat_match_value, null()), coalesce(src, src_ip))) \
| mvexpand ioc_ip | stats count BY ioc_ip | rename ioc_ip AS src | sort - count | head 40 \
| vtcheck field=src count_field=count check_waf=false
