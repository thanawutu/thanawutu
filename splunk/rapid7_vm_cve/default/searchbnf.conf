[r7cve-command]
syntax = r7cve (cve=<string>)? (software=<string>)? (ranges=<string>)? (announced=<string>)? (env=<string>)? (app=<string>)? (verdict=<string>)? (include_inactive=<bool>)? (include_nodata=<bool>)?
shortdesc = Servers affected by a CVE or a software version range, with freshness, Rapid7 result and verdict. Read only.
example1 = | r7cve cve=CVE-2026-20517 env="Prod · DC,Prod · DR"
usage = public

[r7rescan-command]
syntax = r7rescan (cve=<string>)? (software=<string>)? (ranges=<string>)? (env=<string>)? (app=<string>)? (hosts=<string>)? (scope=affected|all)? (dryrun=<bool>)? (detail=<bool>)? (request_id=<string>)? (reason=<string>)? (launched_from=<string>)?
shortdesc = Preview (dryrun=true, default) or request (dryrun=false) a Rapid7 rescan of a group of servers.
example1 = | r7rescan cve=CVE-2026-20517 env="Non-prod" app="Customer portal" dryrun=true
usage = public

[r7cvewatch-command]
syntax = r7cvewatch action=(add|list|update|close|reopen|delete) (cve=<string>)? (announced=<string>)? (software=<string>)? (ranges=<string>)? (notes=<string>)? (with_counts=<bool>)? (include_closed=<bool>)? (autoclose=<bool>)?
shortdesc = Manage the saved CVE watchlist.
example1 = | r7cvewatch action=add cve=CVE-2026-20517 announced=2026-11-18 software="PHP" ranges="8.1 < 8.1.34 ; 8.2 < 8.2.29"
usage = public

[r7scanstatus-command]
syntax = r7scanstatus (job=<string>)? (view=auto|summary|scans|results)? (limit=<int>)?
shortdesc = Status and before/after results of rescan jobs.
example1 = | r7scanstatus job=JOB-20261120102000-AB12
usage = public

[r7scanpoll-command]
syntax = r7scanpoll (max_jobs=<int>)?
shortdesc = Launches requested rescans and follows running ones. Run by the scheduled search only.
usage = public

[r7vercheck-command]
syntax = r7vercheck ranges=<string> (field=<field>)? (vendor_field=<field>)?
shortdesc = Adds range_status and in_range by comparing a version field with vulnerable ranges.
example1 = ... | r7vercheck ranges="< 2.4.63"
usage = public

[r7assetaction-command]
syntax = r7assetaction action=(request|list|done|cancel) (hosts=<string>)? (issue=<string>)? (note=<string>)? (id=<string>)? (request_id=<string>)?
shortdesc = Asset management fix requests for the Rapid7 team (the app never changes Rapid7 sites or the CMDB).
example1 = | r7assetaction action=request hosts="PPRAPI02" issue="Environment differs" note="Move to the PROD site"
usage = public
