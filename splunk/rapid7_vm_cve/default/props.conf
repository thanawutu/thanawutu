[rapid7:vm:software]
# Use the time the collector ran, never a date found inside the event (last scan, install date...).
DATETIME_CONFIG = CURRENT
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000

[rapid7:vm:asset_site]
# Use the time the collector ran, never a date found inside the event (last scan, install date...).
DATETIME_CONFIG = CURRENT
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000

[rapid7:vm:asset_vuln]
# Use the time the collector ran, never a date found inside the event (last scan, install date...).
DATETIME_CONFIG = CURRENT
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# one event per asset with all its vulnerability IDs
TRUNCATE = 0

[rapid7:vm:vuln_content]
# _time = the Rapid7 "modified" date of the check
TIME_PREFIX = "modified":\s*"
TIME_FORMAT = %Y-%m-%d
MAX_TIMESTAMP_LOOKAHEAD = 10
MAX_DAYS_AGO = 10951
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# rollup checks can list thousands of CVEs (400 KB+)
TRUNCATE = 0

[rapid7:vm:scan_job]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
DATETIME_CONFIG = CURRENT
TRUNCATE = 0

[rapid7:vm:scan_result]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
DATETIME_CONFIG = CURRENT

[rapid7:vm:run]
# Use the time the collector ran, never a date found inside the event (last scan, install date...).
DATETIME_CONFIG = CURRENT
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
