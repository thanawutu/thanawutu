[r7_saved_cves_lookup]
external_type = kvstore
collection = r7_saved_cves
fields_list = _key, cve, software, ranges, announced, notes, status, saved_by, saved_at, closed_at

[r7_scan_jobs_lookup]
external_type = kvstore
collection = r7_scan_jobs
fields_list = _key, job_id, status, cve, software, ranges, reason, launched_by, launched_from, created, launched, finished, error

[r7_cmdb_changes_lookup]
external_type = kvstore
collection = r7_cmdb_changes
fields_list = _key, detected, host, change_type, field, from, to, device_category, cmdb_class, cmdb_env

[r7_cmdb_prev_lookup]
external_type = kvstore
collection = r7_cmdb_prev
fields_list = _key, host, cmdb_status, cmdb_class, cmdb_env, device_category
