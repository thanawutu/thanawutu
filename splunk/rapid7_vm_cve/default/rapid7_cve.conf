# Do not edit this file. Copy the stanza to local/rapid7_cve.conf and change it there.
[settings]
# InsightVM console, e.g. https://rapid7-console.example.local:3780
console_url =
# Verify the console certificate. Set ca_bundle to the PEM file of the CA that signed it.
verify_ssl = true
ca_bundle =
# false = connect directly (ignore HTTP(S)_PROXY of the Splunk process)
use_system_proxy = false
# Rapid7 accounts. Passwords go in Splunk's password store (realm rapid7_vm_cve), never here.
# collector_username: read-only account used by the collectors (heavy forwarder).
# scan_username: account allowed to start site scans (search head). Empty = use collector_username.
collector_username =
scan_username =
# Reuse a credential another app already stores (no need to know or retype the password).
# Example for the existing Rapid7 InsightVM app:
#   credential_app = rapid7_insightvm_app
#   credential_realm = rapid7_insightvm_121
# Empty = use the credential stored in this app under realm rapid7_vm_cve.
credential_app =
credential_realm =
# Index the collectors and the poller write to.
index = rapid7
request_timeout = 60
page_size = 500
threads = 4
# Scan template for rescans; empty = each site's default template.
scan_template_id =
max_servers_per_job = 50
max_job_hours = 12
# Version data older than this many days before the announcement is "Stale".
stale_days = 7
# Capability a user needs to launch rescans (granted by role rapid7_cve_rescan).
rescan_capability = rapid7_cve_rescan
# Vulnerability content collector: first run reads this many days, later runs re-read the overlap.
vuln_content_first_days = 30
vuln_content_overlap_days = 2
vuln_content_max_pages = 400
