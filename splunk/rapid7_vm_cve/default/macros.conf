[r7_index]
definition = index=rapid7
iseval = 0

# Latest complete snapshot of a collector sourcetype (uses run_id written by each run).
[r7_latest(1)]
args = st
definition = `r7_index` sourcetype="$st$" earliest=-3d [search `r7_index` sourcetype="$st$" earliest=-3d | stats latest(run_id) as run_id | fields run_id]
iseval = 0

# Rapid7 asset (ip, hostname) -> CMDB record, using the same lookups as the
# "CMDB and Rapid7 Asset Mapping" dashboard: cmdb_ip_map.csv by IP, then
# cmdb_assets.csv by host (falling back to the short Rapid7 hostname).
[r7_cmdb_enrich]
definition = lookup cmdb_ip_map.csv ip OUTPUT host AS cmdb_host \
| eval cmdb_host=mvindex(cmdb_host,0) \
| eval r7_short=upper(replace(hostname,"\..*$","")) \
| eval cmdb_host=coalesce(cmdb_host, if(r7_short="", null(), r7_short)) \
| lookup cmdb_assets.csv host AS cmdb_host OUTPUT cmdb_status cmdb_class cmdb_env device_category appname app_id \
| makemv tokenizer="([^\r\n]+)" appname \
| makemv tokenizer="([^\r\n]+)" app_id \
| eval cmdb_status=coalesce(cmdb_status,"NOT_IN_CMDB") \
| `r7_env_label`
iseval = 0

# Prod = DC (cmdb_class PROD) + DR (cmdb_class DR); Non-prod = NONPROD split by cmdb_env.
# Change the cmdb_env patterns here if your CMDB uses other names for UAT/SIT/DEV.
[r7_env_label]
definition = eval env_label=case( \
    cmdb_class="PROD", "Prod · DC", \
    cmdb_class="DR", "Prod · DR", \
    cmdb_class="NONPROD" AND match(upper(cmdb_env),"UAT"), "Non-prod · UAT", \
    cmdb_class="NONPROD" AND match(upper(cmdb_env),"SIT"), "Non-prod · SIT", \
    cmdb_class="NONPROD" AND match(upper(cmdb_env),"DEV"), "Non-prod · DEV", \
    cmdb_class="NONPROD", "Non-prod · other", \
    isnull(cmdb_class) OR cmdb_class="", "UNKNOWN", \
    true(), cmdb_class) \
| eval env_group=case(like(env_label,"Prod%"),"Prod", like(env_label,"Non-prod%"),"Non-prod", true(), env_label)
iseval = 0
