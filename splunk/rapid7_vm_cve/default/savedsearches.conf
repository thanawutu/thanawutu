# Enable "Rapid7 CVE - scan job poller" on the SEARCH HEAD only (in a search head
# cluster the scheduler runs it on one member). Never enable it on the forwarder.
[Rapid7 CVE - scan job poller]
search = | r7scanpoll
cron_schedule = * * * * *
enableSched = 0
dispatch.earliest_time = -1m
dispatch.latest_time = now
schedule_window = 0
alert.track = 0
description = Launches requested rescans, follows running Rapid7 scans every minute and stores before/after results.

[Rapid7 CVE - CMDB change tracker]
search = | inputlookup cmdb_assets.csv \
| eval host=upper(host) \
| stats first(cmdb_status) as cmdb_status first(cmdb_class) as cmdb_class first(cmdb_env) as cmdb_env first(device_category) as device_category by host \
| join type=outer host [| inputlookup r7_cmdb_prev_lookup | eval host=upper(host) | rename cmdb_status as p_status cmdb_class as p_class cmdb_env as p_env device_category as p_cat | fields host p_status p_class p_env p_cat] \
| eventstats count(p_status) as prev_rows \
| where prev_rows>0 \
| eval detected=strftime(now(),"%Y-%m-%dT%H:%M:%SZ") \
| eval changes=mvappend( \
    if(isnull(p_status) AND isnotnull(cmdb_status), "new_ci|cmdb_status||".cmdb_status, null()), \
    if(isnotnull(p_status) AND isnotnull(cmdb_status) AND p_status!=cmdb_status, "status|cmdb_status|".p_status."|".cmdb_status, null()), \
    if(isnotnull(p_class) AND isnotnull(cmdb_class) AND p_class!=cmdb_class, "environment|cmdb_class|".p_class."|".cmdb_class, null()), \
    if(isnotnull(p_env) AND isnotnull(cmdb_env) AND p_env!=cmdb_env, "environment|cmdb_env|".p_env."|".cmdb_env, null()), \
    if(isnotnull(p_cat) AND isnotnull(device_category) AND p_cat!=device_category, "category|device_category|".p_cat."|".device_category, null())) \
| where isnotnull(changes) \
| mvexpand changes \
| rex field=changes "^(?<change_type>[^|]*)\|(?<field>[^|]*)\|(?<from>[^|]*)\|(?<to>.*)$" \
| eval change_type=case(change_type="status" AND match(to,"DECOMMISSION|INACTIVE"),"status_inactive", change_type="status" AND to="WORKING_ACTIVE","status_active", true(), change_type) \
| table detected host change_type field from to device_category cmdb_class cmdb_env \
| outputlookup append=true r7_cmdb_changes_lookup
cron_schedule = 50 * * * *
enableSched = 1
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.track = 0
description = Compares cmdb_assets.csv with the previous snapshot and appends status, environment and category changes to r7_cmdb_changes.

[Rapid7 CVE - CMDB snapshot]
search = | inputlookup cmdb_assets.csv \
| eval host=upper(host) \
| stats first(cmdb_status) as cmdb_status first(cmdb_class) as cmdb_class first(cmdb_env) as cmdb_env first(device_category) as device_category by host \
| eval _key=host \
| outputlookup r7_cmdb_prev_lookup
cron_schedule = 55 * * * *
enableSched = 1
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.track = 0
description = Saves the current CMDB values so the next change-tracker run can compare.

[Rapid7 CVE - CMDB history backfill (run once)]
search = index=cmdb sourcetype=mssql_inventory_Asset earliest=-90d \
| eval host=upper(ComputerName), day=strftime(_time,"%F") \
| stats latest(ServerStatus) as status by host day \
| sort 0 host day \
| streamstats current=f window=1 last(status) as prev by host \
| where isnotnull(prev) AND prev!=status \
| eval detected=day."T00:00:00Z", field="ServerStatus", from=prev, to=status \
| eval change_type=case(match(status,"DECOMMISSION|INACTIVE"),"status_inactive", status="WORKING_ACTIVE","status_active", true(),"status") \
| table detected host change_type field from to \
| outputlookup append=true r7_cmdb_changes_lookup
enableSched = 0
alert.track = 0
description = One-off: status changes from the last 90 days of daily CMDB loads. Environment history needs the cmdb_class rules of the "CMDB servers" report (not yet included).

[Rapid7 CVE - saved CVE refresh]
search = | r7cvewatch action=list with_counts=true autoclose=true
cron_schedule = 5 */4 * * *
enableSched = 0
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.track = 0
description = Recounts affected servers for open saved CVEs and closes those with no affected Active server. Enable on the search head.

[Rapid7 CVE - recent checks lookup]
search = `r7_index` sourcetype="rapid7:vm:vuln_content" earliest=-31d \
| `r7_vc_fields` \
| spath path=cve_count \
| dedup vuln_id \
| eval cve_count=coalesce(cve_count, mvcount(cves)), rollup=if(cve_count>20,1,0) \
| eval added_e=strptime(substr(added,1,10),"%Y-%m-%d") \
| where added_e>=relative_time(now(),"-30d@d") \
| eval published_e=strptime(substr(published,1,10),"%Y-%m-%d") \
| eval fresh_cve=if(isnotnull(published_e) AND published_e>=added_e-30*86400, 1, 0) \
| eval cves_str=if(rollup=1, "", mvjoin(cves,"|")) \
| rex field=title "^(?<platform>[^:]+):" \
| rex field=title "CVE-\d+-\d+:\s*(?<component>[^:(]+?)\s*:" \
| eval component=coalesce(component, platform), check_platform=replace(vuln_id, "-cve-.*$", "") \
| table vuln_id title platform component check_platform severity cvss_v3 published added modified added_e published_e fresh_cve cve_count rollup cves_str \
| outputlookup r7_recent_checks.csv
cron_schedule = 20 * * * *
enableSched = 1
dispatch.earliest_time = -31d
dispatch.latest_time = now
alert.track = 0
description = Rapid7 checks added in the last 30 days. fresh_cve=1 when the CVE was published at most 30 days before the check was added (Rapid7 sometimes re-adds old checks in bulk). Checks listing more than 20 CVEs are marked rollup=1 and their CVE list is not stored.

[Rapid7 CVE - recent hits lookup]
search = `r7_latest(rapid7:vm:asset_vuln)` \
| `r7_av_fields` \
| lookup local=true r7_recent_checks.csv vuln_id AS vuln_ids OUTPUT vuln_id AS hit \
| where isnotnull(hit) \
| fields asset_id hostname ip hit \
| mvexpand hit \
| lookup local=true r7_recent_checks.csv vuln_id AS hit OUTPUT cves_str severity cvss_v3 rollup fresh_cve added_e published_e published title component platform check_platform \
| eval cve=if(rollup=1, "ROLLUP:".hit, split(cves_str,"|")) \
| mvexpand cve \
| join type=left asset_id [search `r7_latest(rapid7:vm:asset_site)` | dedup asset_id | fields asset_id os] \
| `r7_cmdb_enrich` \
| eval appname=mvjoin(appname,"; ") \
| rename hit as vuln_id \
| table asset_id hostname ip os vuln_id cve title component platform check_platform severity cvss_v3 rollup fresh_cve added_e published_e published cmdb_status env_label env_group appname \
| outputlookup r7_recent_hits.csv
cron_schedule = 30 * * * *
enableSched = 1
dispatch.earliest_time = -3d
dispatch.latest_time = now
alert.track = 0
description = Which servers have a finding for each check added in the last 30 days, with CMDB status and environment. Feeds the CVE impact overview.

[Rapid7 CVE - vuln catalog]
search = `r7_index` sourcetype="rapid7:vm:vuln_content" earliest=0 \
| `r7_vc_fields` \
| spath path=cve_count \
| dedup vuln_id \
| eval cve_count=coalesce(cve_count, mvcount(cves)), rollup=if(cve_count>20,1,0) \
| eval cves_str=if(rollup=1, "", mvjoin(cves,"|")) \
| rex field=title "^(?<platform>[^:]+):" \
| rex field=title "CVE-\d+-\d+:\s*(?<component>[^:(]+?)\s*:" \
| eval component=coalesce(component, platform), _key=vuln_id \
| table _key vuln_id title platform component severity cvss_v3 published added cve_count rollup cves_str \
| outputlookup r7_vuln_catalog_lookup
cron_schedule = 15 5 * * *
enableSched = 1
dispatch.earliest_time = 0
dispatch.latest_time = now
alert.track = 0
description = Full Rapid7 check catalog (title, severity, CVSS, CVEs) in the KV store, for Impacted assets and CVE lookups.

[Rapid7 CVE - asset summary]
search = `r7_latest(rapid7:vm:asset_vuln)` \
| `r7_av_fields` \
| fields asset_id hostname ip vuln_ids last_scan \
| mvexpand vuln_ids \
| lookup r7_vuln_catalog_lookup vuln_id AS vuln_ids OUTPUT severity cvss_v3 added \
| eval added_e=strptime(substr(added,1,10),"%Y-%m-%d"), cv=tonumber(cvss_v3) \
| stats count as open count(eval(severity="Critical")) as critical count(eval(severity="Severe")) as severe count(eval(severity="Moderate")) as moderate count(eval(added_e>=relative_time(now(),"-30d@d"))) as new_30d count(eval(cv>=9)) as cvss9 count(eval(cv>=7)) as cvss7 latest(last_scan) as last_scan by asset_id hostname ip \
| join type=left asset_id [search `r7_latest(rapid7:vm:asset_site)` | dedup asset_id | fields asset_id os site_name credentialed] \
| `r7_cmdb_enrich` \
| eval appname=mvjoin(appname,"; ") \
| table asset_id hostname ip os site_name credentialed last_scan open critical severe moderate new_30d cvss9 cvss7 cmdb_status env_label env_group appname \
| outputlookup r7_asset_summary.csv
cron_schedule = 35 * * * *
enableSched = 1
dispatch.earliest_time = -3d
dispatch.latest_time = now
alert.track = 0
description = Open findings per server (counts by severity, CVSS, new in 30 days) with CMDB environment. Feeds Impacted assets.
