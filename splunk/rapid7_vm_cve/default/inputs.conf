# Collectors: enable on the heavy forwarder that holds the Rapid7 credential (SIEMFWDPR01) only.
[rapid7_software]
python.version = python3

[rapid7_vuln_content]
python.version = python3

[rapid7_asset_vulns]
python.version = python3

[rapid7_software://daily]
interval = 15 2 * * *
index = rapid7
python.version = python3
disabled = 1

[rapid7_vuln_content://every_6h]
interval = 21600
index = rapid7
python.version = python3
disabled = 1

[rapid7_asset_vulns://daily]
interval = 45 3 * * *
index = rapid7
python.version = python3
disabled = 1
